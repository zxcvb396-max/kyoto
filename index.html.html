    const copyTextSafely = async (text) => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {
        // Fallback 실행
      }
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        textArea.style.top = '0';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        return successful;
      } catch (err) {
        return false;
      }
    };

    const encodeShareState = (payload) => {
      const json = JSON.stringify(payload);
      if (window.LZString) {
        return window.LZString.compressToEncodedURIComponent(json);
      }
      return btoa(unescape(encodeURIComponent(json)));
    };

    const decodeShareState = (encoded) => {
      try {
        if (window.LZString) {
          const decompressed = window.LZString.decompressFromEncodedURIComponent(encoded);
          if (decompressed) return JSON.parse(decompressed);
        }
        return JSON.parse(decodeURIComponent(escape(atob(encoded))));
      } catch (e) {
        return null;
      }
    };

    const parseTimeToMinutes = (timeStr) => {
      if (!timeStr) return 9999;
      const match = String(timeStr).match(/(\d{1,2})\s*[:시]\s*(\d{1,2})?/);
      if (!match) return 9999;
      const hours = parseInt(match[1], 10);
      const mins = match[2] ? parseInt(match[2], 10) : 0;
      return hours * 60 + mins;
    };

      return [...list].sort((a, b) => {

        return parseTimeToMinutes(a.time) - parseTimeToMinutes(b.time);
      });

    const getTagBgColor = (tag) => {
      switch(tag) {
        case 'maple': return '#8B263E';

        case 'transport': return '#475569';

    // 인터랙티브 리플렛 지도 컴포넌트
    function MapView({ scheduleItems, activeDay }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current) return;

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current).setView([35.0037, 135.7772], 13);
          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
          }).addTo(map);
          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;

        map.eachLayer((layer) => {
          if (layer instanceof L.Marker || layer instanceof L.Polyline) {
            map.removeLayer(layer);
          }
        });

        const points = scheduleItems.filter(item => item.lat && item.lng);

        if (points.length > 0) {
          const latLngs = points.map(item => [item.lat, item.lng]);

          if (latLngs.length > 1) {
            L.polyline(latLngs, {
              color: '#E85D75',
              weight: 4,
              opacity: 0.8,
              dashArray: '6, 6'
            }).addTo(map);
          }

          points.forEach((item, index) => {
            const pinColor = getTagBgColor(item.tags[0]);
            const iconHtml = `
              <div style="background-color: ${pinColor}; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; border: 2px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
                ${index + 1}
              </div>
            `;
            const customIcon = L.divIcon({
              html: iconHtml,
              className: 'custom-map-pin',
              iconSize: [30, 30],
              iconAnchor: [15, 15]
            });

            const popupContent = `
              <div style="font-family: 'Noto Sans KR', sans-serif; padding: 4px;">
                <div style="font-size: 11px; color: #E85D75; font-weight: 700;">[Day ${item.day}] ${item.time}</div>
                <div style="font-size: 13px; font-weight: 800; color: #111; margin: 3px 0;">${item.title}</div>
                <div style="font-size: 11px; color: #666; margin-bottom: 6px;">${item.transport || ''}</div>
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.locationQuery || item.title)}" target="_blank" style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #E85D75; text-decoration: underline; font-weight: 700;">
                  📍 구글 지도 열기
                </a>
              </div>
            `;

            L.marker([item.lat, item.lng], { icon: customIcon })
              .addTo(map)
              .bindPopup(popupContent);
          });

          const bounds = L.latLngBounds(latLngs);
          map.fitBounds(bounds, { padding: [35, 35], maxZoom: 15 });
        }

        setTimeout(() => map.invalidateSize(), 300);
      }, [scheduleItems, activeDay]);

      return (
        <div className="bg-white rounded-3xl p-4 shadow-sm border-2 border-chiikawa-border overflow-hidden mb-8">
          <div className="flex items-center justify-between mb-3 px-2">
            <div className="flex items-center space-x-2">
              <span className="text-2xl">🗺️</span>
              <h2 className="font-bold text-gray-800 text-base sm:text-lg">교토 3박 4일 동선 지도</h2>
              <span className="text-xs bg-chiikawa-pink/30 text-chiikawa-darkPink font-bold px-3 py-1 rounded-full border border-chiikawa-pink">
                {activeDay === 'all' ? '전체 동선' : `Day ${activeDay} 동선`}
              </span>
            </div>
            <span className="text-xs text-gray-400 font-medium">이동 순서 핀</span>
          </div>
          <div 
            ref={mapContainerRef} 
            className="w-full h-72 sm:h-96 rounded-2xl border border-pink-100 z-10"
          />
        </div>
      );
    }

    // 예산 관리 컴포넌트 (엔화 기준)
    function BudgetTracker({ expenses, setExpenses, totalBudget, setTotalBudget, showToast }) {
      const [name, setName] = useState('');
      const [amount, setAmount] = useState('');
      const [category, setCategory] = useState('shopping');
      const [day, setDay] = useState(1);
      const [isEditingBudget, setIsEditingBudget] = useState(false);
      const [budgetInput, setBudgetInput] = useState(String(totalBudget));

      const totalSpent = useMemo(() => {
        return expenses.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
      }, [expenses]);

      const remainingBudget = totalBudget - totalSpent;
      const spentPercent = totalBudget > 0 ? Math.min(100, Math.round((totalSpent / totalBudget) * 100)) : 0;

      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!name.trim() || !amount) return;

        const newExpense = {
          id: Date.now(),
          day: Number(day),
          category,
          name: name.trim(),
          amount: Number(amount)
        };

        setExpenses(prev => [...prev, newExpense]);
        setName('');
        setAmount('');
        showToast('💰 지출 항목이 추가되었습니다!');
      };

      const handleDeleteExpense = (id) => {
        setExpenses(prev => prev.filter(item => item.id !== id));
        showToast('🗑️ 지출 항목이 삭제되었습니다.');
      };

      return (
        <div className="space-y-6">

              <div className="text-xs font-bold text-gray-500 mb-1">총 설정 예산 (엔화)</div>
              {isEditingBudget ? (
                <div className="flex items-center gap-2 mt-1">
                  <input
                    type="number"
                    value={budgetInput}
                    onChange={(e) => setBudgetInput(e.target.value)}
                    className="w-full px-2.5 py-1.5 border border-pink-300 rounded-xl text-sm font-bold"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      const parsed = Number(budgetInput);
                      if (!isNaN(parsed) && parsed >= 0) {
                        setTotalBudget(parsed);
                        showToast('💰 총 예산이 수정되었습니다!');
                      }
                      setIsEditingBudget(false);

                    className="text-xs bg-chiikawa-darkPink text-white font-bold px-3 py-1.5 rounded-xl whitespace-nowrap"
                  >
                    저장

                </div>

                <div className="flex items-center justify-between">
                  <span className="text-2xl font-extrabold text-gray-800">¥{totalBudget.toLocaleString()}</span>
                  <button 
                    type="button"
                    onClick={() => {
                      setBudgetInput(String(totalBudget));
                      setIsEditingBudget(true);
                    }}
                    className="text-xs text-chiikawa-darkPink font-bold bg-pink-50 px-2 py-1 rounded-lg"
                  >
                    수정
                  </button>
                </div>
              )}

              <div className="text-xs font-bold text-gray-500 mb-1">총 지출 금액 (엔화)</div>

            <div className="bg-white rounded-3xl p-5 border-2 border-pink-100 shadow-sm">

      const [newItemName, setNewItemName] = useState('');
      const [newItemNote, setNewItemNote] = useState('');
      const [newItemCategory, setNewItemCategory] = useState('chiikawa');

      const categories = [
        { id: 'all', label: '전체 보기', icon: '🎒' },
        { id: 'docs', label: '필수 서류·금융', icon: '📄' },
        { id: 'tech', label: '전자기기·통신', icon: '📱' },
        { id: 'clothes', label: '11월 의류·날씨', icon: '🍁' },
        { id: 'chiikawa', label: '치이카와·꿀템', icon: '🧸' }
      ];

      const packedCount = useMemo(() => packingList.filter(i => i.packed).length, [packingList]);
      const totalCount = packingList.length;
      const packedPercent = totalCount > 0 ? Math.round((packedCount / totalCount) * 100) : 0;

      const togglePackItem = (id) => {
        setPackingList(prev => {
          const updated = prev.map(item => item.id === id ? { ...item, packed: !item.packed } : item);
          const nowAllPacked = updated.length > 0 && updated.every(i => i.packed);
          if (nowAllPacked && window.confetti) {
            window.confetti({ particleCount: 70, spread: 70, origin: { y: 0.7 } });
            showToast('🎉 모든 준비물을 완벽하게 챙겼어요! 교토 출발 준비 끝!');
          }
          return updated;
        });
      };

      const handleAddItem = (e) => {
        e.preventDefault();
        if (!newItemName.trim()) return;
        const newItem = {
          id: 'pack_' + Date.now(),
          category: newItemCategory,
          name: newItemName.trim(),
          note: newItemNote.trim() || '직접 추가한 준비물',
          packed: false
        };
        setPackingList(prev => [...prev, newItem]);
        setNewItemName('');
        setNewItemNote('');
        showToast('🎒 새 준비물이 추가되었습니다!');
      };

      const handleDeleteItem = (id) => {
        setPackingList(prev => prev.filter(item => item.id !== id));
        showToast('🗑️ 준비물 항목이 삭제되었습니다.');
      };

      const filteredItems = useMemo(() => {
        if (selectedCategory === 'all') return packingList;
        return packingList.filter(item => item.category === selectedCategory);
      }, [packingList, selectedCategory]);

      const getCategoryBadge = (cat) => {
        switch(cat) {
          case 'docs': return { text: '📄 필수·금융', cls: 'bg-blue-50 text-blue-600 border-blue-200' };
          case 'tech': return { text: '📱 전자·통신', cls: 'bg-purple-50 text-purple-600 border-purple-200' };
          case 'clothes': return { text: '🍁 의류·날씨', cls: 'bg-rose-50 text-kyoto-red border-rose-200' };
          case 'chiikawa': return { text: '🧸 쇼핑·꿀템', cls: 'bg-pink-50 text-chiikawa-darkPink border-pink-200' };
          default: return { text: '🎒 기타', cls: 'bg-gray-50 text-gray-600 border-gray-200' };
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-3xl p-5 border-2 border-chiikawa-border shadow-sm space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center space-x-2">
                <span className="text-2xl">🧳</span>
                <div>
                  <h2 className="font-extrabold text-gray-800 text-base">교토 캐리어 짐 싸기 체크리스트</h2>
                  <p className="text-xs text-gray-500">11월 말 교토 일교차 & 치이카와 굿즈 수납까지 완벽 대비!</p>
                </div>
              </div>
              <div className="text-right">
                <span className="text-lg font-extrabold text-chiikawa-darkPink">{packedCount}</span>
                <span className="text-xs font-bold text-gray-500"> / {totalCount}개 완료 ({packedPercent}%)</span>
              </div>
            </div>

            <div className="w-full bg-pink-100/60 h-3.5 rounded-full overflow-hidden">
              <div 
                className="bg-gradient-to-r from-pink-400 via-rose-400 to-amber-400 h-full transition-all duration-500"
                style={{ width: `${packedPercent}%` }}
              />
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-white rounded-3xl p-5 border-2 border-chiikawa-border shadow-sm h-fit">
              <h3 className="font-bold text-base text-gray-800 mb-4 flex items-center gap-2">
                <span>➕</span> 준비물 직접 추가
              </h3>
              <form onSubmit={handleAddItem} className="space-y-3 text-xs">
                <div>
                  <label className="block font-bold text-gray-700 mb-1">카테고리</label>
                  <select
                    value={newItemCategory}
                    onChange={(e) => setNewItemCategory(e.target.value)}
                    className="w-full p-2.5 border border-pink-200 rounded-xl bg-pink-50/30 font-semibold"
                  >
                    <option value="chiikawa">🧸 치이카와·여행 꿀템</option>
                    <option value="docs">📄 필수 서류·금융</option>
                    <option value="tech">📱 전자기기·통신</option>
                    <option value="clothes">🍁 11월 의류·날씨</option>
                  </select>
                </div>

                <div>
                  <label className="block font-bold text-gray-700 mb-1">준비물 이름</label>
                  <input
                    type="text"
                    placeholder="예: 여분 에코백 / 렌즈 세척액"
                    value={newItemName}
                    onChange={(e) => setNewItemName(e.target.value)}
                    required
                    className="w-full p-2.5 border border-pink-200 rounded-xl focus:ring-2 focus:ring-chiikawa-darkPink focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block font-bold text-gray-700 mb-1">메모 / 팁 (선택)</label>
                  <input
                    type="text"
                    placeholder="예: 기내 반입 가방에 넣기"
                    value={newItemNote}
                    onChange={(e) => setNewItemNote(e.target.value)}
                    className="w-full p-2.5 border border-pink-200 rounded-xl focus:ring-2 focus:ring-chiikawa-darkPink focus:outline-none"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3 bg-chiikawa-darkPink hover:bg-rose-600 text-white font-bold rounded-xl shadow-md transition-colors"
                >
                  리스트에 추가하기
                </button>
              </form>
            </div>

            <div className="lg:col-span-2 bg-white rounded-3xl p-5 border-2 border-chiikawa-border shadow-sm">
              <div className="flex items-center space-x-1.5 overflow-x-auto pb-3 mb-4 border-b border-pink-100 custom-scrollbar">
                {categories.map((cat) => (
                  <button
                    key={cat.id}
                    type="button"
                    onClick={() => setSelectedCategory(cat.id)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                      selectedCategory === cat.id
                        ? 'bg-chiikawa-darkPink text-white shadow-sm'
                        : 'bg-pink-50 text-gray-600 hover:bg-pink-100'
                    }`}
                  >
                    {cat.icon} {cat.label}
                  </button>
                ))}
              </div>

              <div className="space-y-2.5 max-h-[540px] overflow-y-auto custom-scrollbar pr-1">
                {filteredItems.length === 0 ? (
                  <p className="text-center py-8 text-xs text-gray-400">해당 카테고리에 준비물이 없습니다.</p>
                ) : (
                  filteredItems.map((item) => {
                    const badge = getCategoryBadge(item.category);
                    return (
                      <div
                        key={item.id}
                        className={`flex items-center justify-between p-3.5 rounded-2xl border transition-all ${
                          item.packed
                            ? 'border-emerald-200 bg-emerald-50/30 opacity-75'
                            : 'border-pink-100 bg-pink-50/20 hover:bg-pink-50/50'
                        }`}
                      >
                        <div
                          onClick={() => togglePackItem(item.id)}
                          className="flex items-start space-x-3 cursor-pointer flex-1 min-w-0 mr-2"
                        >
                          <button
                            type="button"
                            className={`mt-0.5 flex-shrink-0 w-5 h-5 rounded-md border flex items-center justify-center transition-colors ${
                              item.packed
                                ? 'bg-emerald-500 border-emerald-500 text-white'
                                : 'bg-white border-gray-300'
                            }`}
                          >
                            {item.packed && <i className="fa-solid fa-check text-[10px]"></i>}
                          </button>
                          <div className="min-w-0 flex-1">
                            <div className="flex flex-wrap items-center gap-1.5 mb-0.5">
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md border ${badge.cls}`}>
                                {badge.text}
                              </span>
                              <span className={`text-xs sm:text-sm font-bold ${item.packed ? 'line-through text-gray-400' : 'text-gray-800'}`}>
                                {item.name}
                              </span>
                            </div>
                            {item.note && (
                              <p className="text-[11px] text-gray-500 truncate">
                                💡 {item.note}
                              </p>
                            )}
                          </div>
                        </div>

                        <button
                          type="button"
                          onClick={() => handleDeleteItem(item.id)}
                          className="text-gray-400 hover:text-rose-500 p-1.5 flex-shrink-0"
                          title="삭제"
                        >
                          <i className="fa-solid fa-trash-can text-xs"></i>
                        </button>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 메인 앱 컴포넌트
    function App() {
      const [schedule, setSchedule] = useState(() => {
        try {
          const saved = localStorage.getItem('kyoto_schedule_v3');
          return sortScheduleChronologically(saved ? JSON.parse(saved) : INITIAL_SCHEDULE);
        } catch { return sortScheduleChronologically(INITIAL_SCHEDULE); }
      });

      const [checkedItems, setCheckedItems] = useState(() => {
        try {
          const saved = localStorage.getItem('kyoto_checked_v2');
          return saved ? JSON.parse(saved) : {};
        } catch { return {}; }
      });

      const [memos, setMemos] = useState(() => {
        try {
          const saved = localStorage.getItem('kyoto_memos_v2');
          return saved ? JSON.parse(saved) : [
            { id: 1, text: '치이카와 모구모구 본포 교토 한정 마스코트 닌자 햄스터 🛍️', done: false },
            { id: 2, text: '치이카와랜드 교토점 가와라마치 OPA 3층 굿즈 🧸', done: false },
            { id: 3, text: '니시키 시장 와규 꼬치 & 계란말이 먹방 🍡', done: false }
          ];
        } catch { return []; }
      });

      const [expenses, setExpenses] = useState(() => {
        try {
          const saved = localStorage.getItem('kyoto_expenses_v2');
          return saved ? JSON.parse(saved) : INITIAL_EXPENSES;
        } catch { return INITIAL_EXPENSES; }
      });

      const [totalBudget, setTotalBudget] = useState(() => {
        try {
          const saved = localStorage.getItem('kyoto_budget_v2');
          return saved ? Number(saved) : 100000;
        } catch { return 100000; }
      });

      const [packingList, setPackingList] = useState(() => {
        try {
          const saved = localStorage.getItem('kyoto_packing_v1');
          return saved ? JSON.parse(saved) : INITIAL_PACKING_LIST;
        } catch { return INITIAL_PACKING_LIST; }
      });

      const [stampCount, setStampCount] = useState(0);
      const [mainTab, setMainTab] = useState('schedule'); // 'schedule' | 'budget' | 'packing'
      const [activeDay, setActiveDay] = useState('all');
      const [activeCategory, setActiveCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [toastMessage, setToastMessage] = useState('');
      const [newMemoText, setNewMemoText] = useState('');
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [generatedShareUrl, setGeneratedShareUrl] = useState('');

      // 모달 상태
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [formData, setFormData] = useState({
        day: 1,
        time: '',
        title: '',
        details: '',
        transport: '',
        tag: 'gourmet',
        presetLocation: 0
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 2800);
      };

      // 공유 URL 해시(#share=...)가 포함된 링크로 접속 시 데이터 자동 복원
      useEffect(() => {
        const hash = window.location.hash || '';
        if (hash.startsWith('#share=')) {
          const encoded = hash.slice('#share='.length);
          const decoded = decodeShareState(encoded);
          if (decoded) {
            if (Array.isArray(decoded.schedule)) {
              setSchedule(sortScheduleChronologically(decoded.schedule));
            }
            if (Array.isArray(decoded.expenses)) {
              setExpenses(decoded.expenses);
            }
            if (typeof decoded.totalBudget === 'number') {
              setTotalBudget(decoded.totalBudget);
            }
            if (Array.isArray(decoded.memos)) {
              setMemos(decoded.memos);
            }
            if (Array.isArray(decoded.packingList)) {
              setPackingList(decoded.packingList);
            }
            showToast('✨ 공유된 최신 일정 데이터를 불러왔습니다!');
          }
        }
      }, []);

      // 데이터 자동 저장
      useEffect(() => {
        localStorage.setItem('kyoto_schedule_v3', JSON.stringify(schedule));
      }, [schedule]);

      useEffect(() => {
        localStorage.setItem('kyoto_checked_v2', JSON.stringify(checkedItems));
      }, [checkedItems]);

      useEffect(() => {
        localStorage.setItem('kyoto_memos_v2', JSON.stringify(memos));
      }, [memos]);

      useEffect(() => {
        localStorage.setItem('kyoto_expenses_v2', JSON.stringify(expenses));
      }, [expenses]);

      useEffect(() => {
        localStorage.setItem('kyoto_budget_v2', String(totalBudget));
      }, [totalBudget]);

      useEffect(() => {
        localStorage.setItem('kyoto_packing_v1', JSON.stringify(packingList));
      }, [packingList]);

      // 현재 수정 내역이 담긴 공유 URL 생성 및 모달 열기
      const handleOpenShareModal = async () => {
        const encoded = encodeShareState({
          schedule,
          expenses,
          totalBudget,
          memos,
          packingList
        });

        try {
          window.history.replaceState(null, '', '#share=' + encoded);
        } catch (e) {
          // sandbox 환경 예외 무시
        }

        const isWebUrl = window.location.href.startsWith('http');
        const fullUrl = isWebUrl
          ? `${window.location.origin}${window.location.pathname}#share=${encoded}`
          : '';

        setGeneratedShareUrl(fullUrl);
        setIsShareModalOpen(true);

        if (fullUrl) {
          const copied = await copyTextSafely(fullUrl);
          if (copied) {
            showToast('🔗 수정사항이 포함된 공유 링크가 복사되었습니다!');
          }
        }
      };

      // 카톡 공유용 일정 텍스트 복사
      const copyItineraryToClipboard = async () => {
        const dayLabels = {
          1: '🍁 Day 1 (11/20 금)',
          2: '🎋 Day 2 (11/21 토)',
          3: '🧸 Day 3 (11/22 일)',
          4: '✈️ Day 4 (11/23 월)'
        };
        let text = '🍁 교토 3박 4일 여행 일정 (11/20 금 ~ 11/23 월)\n📍 숙소: 6-chōme-534-20 Gojōbashihigashi, Higashiyama Ward, Kyoto\n\n';
        [1, 2, 3, 4].forEach(d => {
          const items = sortScheduleChronologically(schedule).filter(s => s.day === d);
          if (items.length > 0) {
            text += `${dayLabels[d]}\n`;
            items.forEach(item => {
              text += `- [${item.time}] ${item.title} (${item.transport})\n`;
            });
            text += '\n';
          }
        });
        const ok = await copyTextSafely(text);
        if (ok) {
          showToast('📋 카톡 공유용 전체 일정이 복사되었습니다!');
        } else {
          showToast('⚠️ 복사에 실패했습니다.');
        }
      };

      const resetScheduleToDefault = () => {
        const sortedDefault = sortScheduleChronologically(INITIAL_SCHEDULE);
        setSchedule(sortedDefault);
        try {
          window.history.replaceState(null, '', window.location.pathname);
        } catch (e) {}
        showToast('🔄 최신 추천 일정(11/20 에이칸도 · 11/21 청수사)으로 초기화되었습니다!');
      };

      const changeItemDayQuickly = (id, newDay) => {
        const dayNum = Number(newDay);
        setSchedule(prev => sortScheduleChronologically(
          prev.map(item => item.id === id ? {
            ...item,
            day: dayNum,
            date: getDateLabelByDay(dayNum)
          } : item)
        ));
        showToast(`📅 ${getDateLabelByDay(dayNum)} 일정으로 이동 및 시간순 정렬 완료!`);
      };

      const toggleCheck = (id) => {
        setCheckedItems(prev => {
          const next = { ...prev, [id]: !prev[id] };
          if (next[id] && window.confetti) {
            window.confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
          }
          return next;
        });
      };

      const progressPercent = useMemo(() => {
        if (schedule.length === 0) return 0;
        const checkedCount = Object.values(checkedItems).filter(Boolean).length;
        return Math.round((checkedCount / schedule.length) * 100);
      }, [schedule, checkedItems]);

      const filteredSchedule = useMemo(() => {
        const filtered = schedule.filter(item => {
          const matchDay = activeDay === 'all' || Number(item.day) === Number(activeDay);
          const matchCat = activeCategory === 'all' || item.tags.includes(activeCategory);
          const matchSearch = searchQuery === '' || 
            item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.details.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.time.toLowerCase().includes(searchQuery.toLowerCase());
          return matchDay && matchCat && matchSearch;
        });
        return sortScheduleChronologically(filtered);
      }, [schedule, activeDay, activeCategory, searchQuery]);

      // 모달 열기/닫기
      const openAddModal = (targetDay = 1) => {
        setEditingItem(null);
        setFormData({
          day: Number(targetDay),
          time: '12:00 ~ 13:00',
          title: '',
          details: '',
          transport: '도보 이동',
          tag: 'gourmet',
          presetLocation: 0
        });
        setIsModalOpen(true);
      };

      const openEditModal = (item) => {
        setEditingItem(item);
        setFormData({
          day: Number(item.day),
          time: item.time,
          title: item.title,
          details: item.details,
          transport: item.transport,
          tag: item.tags[0] || 'gourmet',
          presetLocation: -1
        });
        setIsModalOpen(true);
      };

      const handleSaveSchedule = (e) => {
        e.preventDefault();
        const dayNum = Number(formData.day);
        const presetIdx = Number(formData.presetLocation);
        const preset = presetIdx >= 0 ? (LOCATION_PRESETS[presetIdx] || LOCATION_PRESETS[0]) : null;

        if (editingItem) {
          setSchedule(prev => sortScheduleChronologically(
            prev.map(item => item.id === editingItem.id ? {
              ...item,
              day: dayNum,
              date: getDateLabelByDay(dayNum),
              time: formData.time,
              title: formData.title,
              details: formData.details,
              transport: formData.transport,
              tags: [formData.tag],
              locationQuery: preset ? preset.name : item.locationQuery,
              lat: preset ? preset.lat : item.lat,
              lng: preset ? preset.lng : item.lng
            } : item)
          ));
          showToast('✏️ 일정이 수정 및 시간순 정렬되었습니다.');
        } else {
          const chosenPreset = preset || LOCATION_PRESETS[0];
          const newItem = {
            id: 'custom_' + Date.now(),
            day: dayNum,
            date: getDateLabelByDay(dayNum),
            time: formData.time,
            title: formData.title,
            details: formData.details,
            transport: formData.transport,
            tags: [formData.tag],
            locationQuery: chosenPreset.name,
            lat: chosenPreset.lat,
            lng: chosenPreset.lng
          };
          setSchedule(prev => sortScheduleChronologically([...prev, newItem]));
          showToast('➕ 새 일정이 추가 및 시간순 정렬되었습니다.');
        }
        setIsModalOpen(false);
      };

      const handleDeleteSchedule = (id) => {
        setSchedule(prev => prev.filter(item => item.id !== id));
        showToast('🗑️ 일정이 삭제되었습니다.');
      };

      // 메모 관리
      const addMemo = (e) => {
        e.preventDefault();
        if (!newMemoText.trim()) return;
        setMemos(prev => [...prev, { id: Date.now(), text: newMemoText.trim(), done: false }]);
        setNewMemoText('');
        showToast('📝 위시리스트가 추가되었습니다.');
      };

      const toggleMemo = (id) => {
        setMemos(prev => prev.map(m => m.id === id ? { ...m, done: !m.done } : m));
      };

      const deleteMemo = (id) => {
        setMemos(prev => prev.filter(m => m.id !== id));
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-6">

          {/* 토스트 알림 */}
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-gray-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl animate-bounce flex items-center space-x-2">
              <span>{toastMessage}</span>
            </div>
          )}

          {/* 메인 헤더 */}
          <header className="bg-gradient-to-r from-kyoto-red via-rose-700 to-amber-700 text-white rounded-3xl p-6 shadow-xl mb-6 relative overflow-hidden">
            <div className="relative z-10">
              <div className="flex flex-wrap items-center justify-between gap-3 mb-2">
                <span className="bg-white/20 backdrop-blur-md text-white text-xs font-bold px-3 py-1 rounded-full border border-white/30">
                  🍁 교토 3박 4일 단풍 & 먹방 & 치이카와 쇼핑

            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar border-2 border-chiikawa-border">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="text-lg font-bold text-gray-800">
                    {editingItem ? '✏️ 일정 수정' : '➕ 새 일정 추가'}
                  </h3>
                  <button type="button" onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveSchedule} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-gray-700 mb-1">일차 (Day)</label>
                      <select 
                        value={formData.day} 
                        onChange={(e) => setFormData({ ...formData, day: Number(e.target.value) })}
                        className="w-full p-2.5 border border-pink-200 rounded-xl bg-pink-50/30"
                      >
                        <option value={1}>Day 1 (11/20 금)</option>
                        <option value={2}>Day 2 (11/21 토)</option>
                        <option value={3}>Day 3 (11/22 일)</option>
                        <option value={4}>Day 4 (11/23 월)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-gray-700 mb-1">카테고리</label>
                      <select 
                        value={formData.tag} 
                        onChange={(e) => setFormData({ ...formData, tag: e.target.value })}
                        className="w-full p-2.5 border border-pink-200 rounded-xl bg-pink-50/30"
                      >
                        <option value="gourmet">🍡 먹방 / 맛집</option>
                        <option value="maple">🍁 단풍 / 관광</option>
                        <option value="shopping">🧸 치이카와 / 쇼핑</option>
                        <option value="transport">🚌 이동 / 교통</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-gray-700 mb-1">시간 (예: 12:30 ~ 14:00)</label>
                    <input 
                      type="text" 
                      value={formData.time} 
                      onChange={(e) => setFormData({ ...formData, time: e.target.value })}
                      required
                      className="w-full p-2.5 border border-pink-200 rounded-xl"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-gray-700 mb-1">일정 / 장소 제목</label>
                    <input 
                      type="text" 
                      placeholder="예: 가와라마치 라멘 맛집" 
                      value={formData.title} 
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      required
                      className="w-full p-2.5 border border-pink-200 rounded-xl"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-gray-700 mb-1">상세 내용 및 팁</label>
                    <textarea 
                      rows="3"
                      placeholder="상세 일정 내용..."
                      value={formData.details} 
                      onChange={(e) => setFormData({ ...formData, details: e.target.value })}
                      className="w-full p-2.5 border border-pink-200 rounded-xl"
                    ></textarea>
                  </div>

                  <div>
                    <label className="block font-bold text-gray-700 mb-1">이동 방법</label>
                    <input 
                      type="text" 
                      placeholder="예: 도보 5분 / 버스 206번" 
                      value={formData.transport} 
                      onChange={(e) => setFormData({ ...formData, transport: e.target.value })}
                      className="w-full p-2.5 border border-pink-200 rounded-xl"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-gray-700 mb-1">지도 위치 영역 (핀 표시용)</label>
                    <select 
                      value={formData.presetLocation} 
                      onChange={(e) => setFormData({ ...formData, presetLocation: Number(e.target.value) })}
                      className="w-full p-2.5 border border-pink-200 rounded-xl bg-pink-50/30"
                    >
                      {editingItem && (
                        <option value={-1}>📍 기존 지도 위치 유지 ({editingItem.locationQuery})</option>
                      )}
                      {LOCATION_PRESETS.map((preset, idx) => (
                        <option key={idx} value={idx}>{preset.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="pt-3 flex gap-2 justify-end">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 border rounded-xl text-gray-600 hover:bg-gray-100"
                    >
                      취소
                    </button>
                    <button 
                      type="submit"
                      className="px-5 py-2 bg-chiikawa-darkPink hover:bg-rose-600 text-white font-bold rounded-xl shadow-md"
                    >
                      저장하기
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
